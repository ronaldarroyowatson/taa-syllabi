# Purpose: Class-specific source data for generating the Physical Science syllabus outputs.
course_name: Physical Science
term: Fall Semester 2026
grades: "9"
class_time: Period 3, Monday-Friday, 9:40 am-10:30 am
textbook: Physical Science with Earth Science by Ralph Feathe and colleagues.
course_description: This course covers core physical and earth science concepts using the adopted textbook.
units:
  - Unit 1 Motion and Forces: Module 2 Motion; Module 3 Forces and Newton's Laws.
  - Unit 2 Energy: Module 4 Work and Energy; Module 5 Thermal Energy; Module 6 Electricity; Module 7 Magnetism and Its Uses; Module 8 Energy Sources and the Environment.
  - Unit 3 Waves: Module 9 Introduction to Waves; Module 10 Sound; Module 11 Electromagnetic Waves; Module 12 Light; Module 13 Mirrors and Lenses.
  - Unit 4 Matter: Module 14 Solids, Liquids, and Gases; Module 15 Classification of Matter; Module 16 Properties of Atoms and the Periodic Table; Module 17 Elements and Their Properties.
  - Unit 5 Reactions: Module 18 Chemical Bonds; Module 19 Chemical Reactions; Module 20 Radioactivity and Nuclear Reactions.
  - Unit 6 Applications of Chemistry: Module 21 Solutions; Module 22 Acids, Bases, and Salts; Module 23 Organic Compounds; Module 24 New Materials Through Chemistry.
  - Unit 7 Earth: Module 25 Earth's Internal Processes; Module 26 Earth Materials; Module 27 Earth's Changing Surface; Module 28 Weather and Climate.
  - Unit 8 Space: Module 29 The Earth-Moon-Sun System; Module 30 The Solar System; Module 31 Stars and Galaxies.
required_materials:
  - School uniform (including closed-toed shoes; no exceptions).
  - Graphing calculator (TI-83 series or similar; TI-89 series not allowed).
  - iPad (fully charged and connected to Wi-Fi).
optional_materials:
  - Optional note-taking device such as an iPad, tablet, or laptop.
exam_schedule:
  - Tests follow the textbook pacing guide.
  - A review day is scheduled before each test.
  - There are no other officially set testing days.
reading_level: high-school
instructor_name: Ronald Arroyo-Watson
instructor_email: rarroyo-watson@tulsaacademy.org
office_location: Main campus office
office_hours: "Mon-Thu: 8 am-3 pm; Fri: 8 am-2 pm; technology help available during the last class period of the day."
