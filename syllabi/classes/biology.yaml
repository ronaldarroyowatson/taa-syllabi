course_description: Placeholder description. Replace with class-specific summary.
units:
  - Introduction: Chapter 1 Foundations of Biology; Chapter 2 Biology Connections.
  - Unit 1 Ecology and Interdependence: Chapter 3 Ecosystems; Chapter 4 Populations and Communities; Chapter 5 Conservation.
  - Unit 2 Cell Structure and Processes: Chapter 6 Molecules of Life; Chapter 7 Cell Structure and Function; Chapter 8 Photosynthesis; Chapter 9 Cellular Respiration; Chapter 10 The Cell Cycle.
  - Unit 3 Genetics: Chapter 11 Mendelian and Population Genetics; Chapter 12 Chromosomes and Inheritance; Chapter 13 Gene Expression and Regulation; Chapter 14 Technology and Bioethics.
  - Unit 4 Taxonomy: Chapter 15 Classification; Chapter 16 Viruses, Prokaryotes, Protists, and Fungi; Chapter 17 Plants; Chapter 18 Invertebrates.
  - Unit 5 Human Biology: Chapter 21 The Human Body and Integument; Chapter 22 The Nervous System; Chapter 23 The Skeletal and Muscular Systems; Chapter 24 The Circulatory and Respiratory Systems; Chapter 25 The Digestive, Lymphatic, and Immune Systems; Chapter 26 The Reproductive, Endocrine, and Urinary Systems.
  - Conclusion: Chapter 27 The Beginning and the End.
